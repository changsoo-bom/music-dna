name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # 배점 자체 점검. 무드 7종 도달·페르소나 5종 도달·비중 합 100 등을 본다.
      # 이 저장소에서 가장 잘 깨지는 게 여기라 build 보다 먼저 돌린다.
      - run: pnpm check:quiz

      - run: pnpm build
